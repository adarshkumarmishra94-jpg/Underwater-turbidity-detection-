# Training Configuration
# Applies to all fine-tuning runs (can be overridden per-model)

training:
  epochs: 30              # 30 epochs for ALL models — do not deviate
  batch_size: 32          # Auto-adjusted for larger models
  imgsz: 640
  optimizer: "auto"       # Ultralytics default (SGD with cosine lr)
  lr0: 0.01
  lrf: 0.01              # Final learning rate factor
  momentum: 0.937
  weight_decay: 0.0005
  warmup_epochs: 3
  patience: 15            # Early stopping patience
  save_period: 10         # Save checkpoint every N epochs
  workers: 8
  device: 0               # GPU device
  project: "checkpoints"
  exist_ok: true
  pretrained: true
  resume: false
  seed: 42
  deterministic: true
  amp: true               # Automatic mixed precision
  cache: false            # Don't cache images in RAM (large datasets)
  close_mosaic: 10        # Disable mosaic augmentation last N epochs

# Batch size adjustments for larger models (auto-adjusted in train.py)
# Scaled to maximum safe saturation on 40GB A100 VRAM
batch_overrides:
  nano: 256
  small: 192
  medium: 112
  large: 72
  xlarge: 48
  extended: 48
  balanced: 48
  compact: 48
  tiny: 160

# Evaluation
evaluation:
  conf: 0.001             # Low confidence for comprehensive eval
  iou: 0.6
  max_det: 300
  split: "val"

# WandB
wandb:
  project: "turbid_review"
  log_model: true
  log_dataset: false

# Inference — benchmark at 3 image sizes
inference:
  image_sizes: [224, 480, 640]   # Three sizes for inference tables
  conf: 0.25
  iou: 0.45
  max_det: 300
  save: true
  save_txt: true
  save_conf: true

# Jetson Nano edge inference
edge:
  max_images: 50          # Only 50 images due to storage constraints
  data_dir: "/data/turbid_review"   # Jetson: /dev/sda1 mounted at /data
  one_by_one: true        # Process one model at a time, clean up after

# Export (for Jetson Nano)
export:
  format: "onnx"
  imgsz: 640
  half: false             # Jetson Nano may not support FP16 ONNX well
  dynamic: false
  simplify: true
  opset: 12
