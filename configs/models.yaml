# YOLO Model Registry — All variants to benchmark
# Format: model_name: pretrained_weight_file
# Ultralytics will load weights from checkpoints/pretrained_checkpoints/

# ─── YOLOv3 (legacy) ───
yolov3:
  - name: yolov3u
    weights: checkpoints/pretrained_checkpoints/yolov3u.pt
    size: large
  - name: yolov3-tinyu
    weights: checkpoints/pretrained_checkpoints/yolov3-tinyu.pt
    size: tiny

# ─── YOLOv5 (updated architecture with ultralytics) ───
yolov5:
  - name: yolov5nu
    weights: checkpoints/pretrained_checkpoints/yolov5nu.pt
    size: nano
  - name: yolov5su
    weights: checkpoints/pretrained_checkpoints/yolov5su.pt
    size: small
  - name: yolov5mu
    weights: checkpoints/pretrained_checkpoints/yolov5mu.pt
    size: medium
  - name: yolov5lu
    weights: checkpoints/pretrained_checkpoints/yolov5lu.pt
    size: large
  - name: yolov5xu
    weights: checkpoints/pretrained_checkpoints/yolov5xu.pt
    size: xlarge

